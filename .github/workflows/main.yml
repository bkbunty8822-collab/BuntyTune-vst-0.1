name: Build DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: BuntyTune-DLL
        path: build/BuntyTune_artefacts/Release/
